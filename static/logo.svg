<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Modern Gradient: Vibrant Azure to Deep Navy -->
    <linearGradient id="shieldFill" x1="80" y1="40" x2="432" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Clip Accent Gradient -->
    <linearGradient id="clipFill" x1="200" y1="90" x2="312" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Security Gold Gradient -->
    <linearGradient id="lockFill" x1="280" y1="300" x2="336" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 1. Exterior Outer Shield (Fortress Security) -->
  <path d="M 256 40
           C 344 40 432 76 432 136
           C 432 290 344 404 256 472
           C 168 404 80 290 80 136
           C 80 76 168 40 256 40 Z"
        fill="url(#shieldFill)"/>

  <!-- 2. Subtle Shield Inner Border / Inset Highlight -->
  <path d="M 256 56
           C 334 56 414 88 414 142
           C 414 278 334 384 256 448
           C 178 384 98 278 98 142
           C 98 88 178 56 256 56 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.22"
        stroke-width="5"/>

  <!-- 3. Clipboard Note Paper (Crisp Modern Card) -->
  <rect x="166" y="152" width="180" height="226" rx="20"
        fill="#FFFFFF"/>

  <!-- 4. Clipboard Header Clamp / Hardware Wire -->
  <path d="M 226 142
           V 112
           C 226 98 286 98 286 112
           V 142"
        fill="none"
        stroke="url(#clipFill)"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Clamp Base Plate -->
  <rect x="206" y="130" width="100" height="38" rx="8"
        fill="#0F172A"/>
  <rect x="214" y="136" width="84" height="24" rx="5"
        fill="url(#clipFill)"/>
  <circle cx="256" cy="148" r="4.5" fill="#FFFFFF"/>

  <!-- 5. Clipboard Data Lines -->
  <rect x="194" y="200" width="124" height="12" rx="6" fill="#2563EB"/>
  <rect x="194" y="226" width="92" height="12" rx="6" fill="#3B82F6" fill-opacity="0.8"/>
  <rect x="194" y="252" width="108" height="12" rx="6" fill="#60A5FA" fill-opacity="0.6"/>
  <rect x="194" y="278" width="70" height="12" rx="6" fill="#93C5FD" fill-opacity="0.5"/>

  <!-- 6. Fort Security Padlock Badge (Bottom Right) -->
  <g>
    <!-- Lock Shackle -->
    <path d="M 295 316
             V 302
             C 295 288 321 288 321 302
             V 316"
          fill="none"
          stroke="#D97706"
          stroke-width="6"
          stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="282" y="314" width="52" height="42" rx="10"
          fill="url(#lockFill)"/>
    <!-- Keyhole -->
    <circle cx="308" cy="330" r="4.5" fill="#1E293B"/>
    <path d="M 306 332 L 310 332 L 311.5 344 L 304.5 344 Z" fill="#1E293B"/>
  </g>
</svg>
